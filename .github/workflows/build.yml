name: build-and-release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - name: Checkout source (peditx/peditx-ai-windows)
        uses: actions/checkout@v4
        with:
          repository: peditx/peditx-ai-windows
          token: ${{ secrets.PEDITX_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build single-file exe
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --onefile --name PeDitX-AI --icon assets/peditx-ai.ico --add-data "web;web" --add-data "assets;assets" --paths src src/peditx_ai.py
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build NSIS installer
        run: |
          $nsis = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) { Write-Error "makensis.exe not found after choco install"; exit 1 }
          & $nsis packaging\installer.nsi
        shell: pwsh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: peditx-ai-windows
          path: dist/PeDitX-AI-Setup-x64.exe
          if-no-files-found: error
      - name: Create GitHub Release on peditx/peditx-ai-windows
        if: ${{ github.event.inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.PEDITX_TOKEN }}
        run: |
          gh release create ${{ github.event.inputs.tag }} `
            dist/PeDitX-AI-Setup-x64.exe `
            --repo peditx/peditx-ai-windows `
            --title "PeDitX-AI ${{ github.event.inputs.tag }}" `
            --notes "Windows NSIS installer – built by CI on peditxos-passwall/peditx-ai-windows-builder"
        shell: pwsh
